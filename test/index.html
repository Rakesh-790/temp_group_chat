<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Test Client</title>
</head>

<body>

    <h2>Socket.IO Test Client</h2>

    <input id="token" type="text" placeholder="Paste Access Token" style="width: 600px;" />

    <br><br>

    <button id="connect">
        Connect
    </button>

    <button id="disconnect">
        Disconnect
    </button>

    <button id="joinRoom">
        Join Room
    </button>

    <button id="leaveRoom">
        Leave Room
    </button>

    <pre id="logs"></pre>

    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>

    <script>

        let socket = null;

        const logs = document.getElementById("logs");

        function log(message) {
            logs.textContent += message + "\n";
        }

        document
            .getElementById("connect")
            .addEventListener("click", () => {

                const token =
                    document.getElementById("token").value;

                socket = io("http://localhost:3000", {
                    autoConnect: false,

                    auth: {
                        accessToken: token
                    },

                    transports: ["websocket"], // optional for debugging

                    withCredentials: true
                });

                socket.on("connect", () => {
                    log("✅ Connected");
                    log("Socket Id: " + socket.id);
                });

                socket.on("connect_error", (error) => {
                    log("❌ " + error.message);
                });

                socket.on("disconnect", (reason) => {
                    log("Disconnected: " + reason);
                });

                socket.connect();

            });

        document
            .getElementById("disconnect")
            .addEventListener("click", () => {

                if (socket) {
                    socket.disconnect();
                }

            });

        document
            .getElementById("joinRoom")
            .addEventListener("click", () => {

                if (!socket) {
                    log("❌ Socket not connected");
                    return;
                }

                socket.emit("room:join", {roomId: "6a4e01817f0ef5bca3edf803"},
                (response) => {
                            console.log(response);
                });

                log("📥 Join Room Event Sent");

            });

        document
            .getElementById("leaveRoom")
            .addEventListener("click", () => {

                if (!socket) {
                    log("❌ Socket not connected");
                    return;
                }

                socket.emit("room:leave", {roomId : "6a4e01817f0ef5bca3edf803"},
                (response) => {
                    console.log(response);
                });

                log("📤 Leave Room Event Sent");

            });

    </script>

</body>

</html>
