<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Test Client</title>
</head>

<body>

    <h2>Socket.IO Test Client</h2>

    <input id="token" type="text" placeholder="Paste Access Token" style="width: 600px;" />

    <br><br>

    <button id="connect">
        Connect
    </button>

    <button id="disconnect">
        Disconnect
    </button>

    <button id="joinRoom">
        Join Room
    </button>

    <button id="leaveRoom">
        Leave Room
    </button>

    <br><br>

    <input id="message" type="text" placeholder="Type a message..." style="width: 400px;" />

    <button id="sendMessage">
        Send Message
    </button>

    <button id="markRead">
        Mark Read
    </button>

    <pre id="logs"></pre>

    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>

    <script>

        let socket = null;

        let currentUserId = null;

        const unreadMessageIds = [];

        const logs = document.getElementById("logs");

        function log(message) {
            logs.textContent += message + "\n";
        }

        function parseJwt(token) {

            const base64Payload = token.split(".")[1];

            const payload = JSON.parse(
                atob(base64Payload)
            );

            return payload;
        }

        document
            .getElementById("connect")
            .addEventListener("click", () => {

                const token =
                    document.getElementById("token").value;


                socket = io("http://localhost:3000", {
                    autoConnect: false,

                    auth: {
                        accessToken: token
                    },

                    transports: ["websocket"], // optional for debugging

                    withCredentials: true
                });

                socket.on("connect", () => {

                    const token = document.getElementById("token").value;

                    currentUserId = parseJwt(token).id;

                    log("✅ Connected");
                    log("Socket Id: " + socket.id);

                });

                socket.on("connect_error", (error) => {
                    log("❌ " + error.message);
                });

                socket.on("disconnect", (reason) => {
                    log("Disconnected: " + reason);
                });

                socket.on("message:new", (message) => {

                    log(
                        `💬 ${message.sender}: ${message.content}`
                    );

                    console.log(message);

                    unreadMessageIds.push(message._id);

                    // Don't acknowledge your own message
                    if (message.sender === currentUserId) {
                        return;
                    }

                    socket.emit(
                        "message:delivered",
                        {
                            groupId: message.group,
                            messageIds: [message._id]
                        },
                        (response) => {

                            console.log("DELIVERY:", response);

                            log(JSON.stringify(response));

                        }
                    );

                });

                socket.on("message:read:update", (data) => {

                    console.log("READ UPDATE", data);

                    log(
                        `✅ ${data.userId} read ${data.messageIds.length} message(s)`
                    );

                });

                socket.on("message:delivery:update", (data) => {

                    console.log("DELIVERY UPDATE", data);

                    log(
                        `📦 ${data.userId} received ${data.messageIds.length} message(s)`
                    );

                });

                socket.connect();

            });

        document
            .getElementById("disconnect")
            .addEventListener("click", () => {

                if (socket) {
                    socket.disconnect();
                }

            });

        document
            .getElementById("joinRoom")
            .addEventListener("click", () => {

                if (!socket) {
                    log("❌ Socket not connected");
                    return;
                }

                socket.emit("room:join", { roomId: "6a55c4bf6a60c589a1024e0f" },
                    (response) => {
                        console.log(response);
                    });

                log("📥 Join Room Event Sent");

            });

        document
            .getElementById("leaveRoom")
            .addEventListener("click", () => {

                if (!socket) {
                    log("❌ Socket not connected");
                    return;
                }

                socket.emit("room:leave", { roomId: "6a55c4bf6a60c589a1024e0f" },
                    (response) => {
                        console.log(response);
                    });

                log("📤 Leave Room Event Sent");

            });

        document
            .getElementById("sendMessage")
            .addEventListener("click", () => {

                if (!socket) {
                    log("❌ Socket not connected");
                    return;
                }

                const content =
                    document.getElementById("message").value;

                socket.emit(
                    "message:send",
                    {
                        groupId: "6a55c4bf6a60c589a1024e0f",
                        type: "TEXT",
                        content
                    },
                    (response) => {
                        console.log(response);
                        log(JSON.stringify(response));
                    }
                );

            });

        document
            .getElementById("markRead")
            .addEventListener("click", () => {

                if (!socket) {
                    log("❌ Socket not connected");
                    return;
                }

                if (unreadMessageIds.length === 0) {
                    log("❌ No unread messages");
                    return;
                }

                console.log("Sending read receipt...");

                socket.emit(
                    "message:read",
                    {
                        groupId: "6a55c4bf6a60c589a1024e0f",
                        messageIds: [...unreadMessageIds]
                    },
                    (response) => {

                        console.log(response);

                        log(JSON.stringify(response));

                    }
                );

                unreadMessageIds.length = 0;

            });

    </script>

</body>

</html>
